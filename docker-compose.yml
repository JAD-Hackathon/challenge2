services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    env_file: api/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml:
    build: ./ml
    environment:
      ML_SHARED_DIR: /data
      ML_MOCK: "true" # switch off once the real models are in
    ports:
      - "8001:8000" # lets you run the API outside Docker against it
    volumes:
      - shared:/data
      - ./ml/weights:/ml/weights # weights stay out of the image

  api:
    build: ./api
    env_file: api/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ML_SERVICE_URL: http://ml:8000
      SHARED_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - shared:/data
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started

volumes:
  pgdata:
  shared: # blurred images: ML writes, API reads
