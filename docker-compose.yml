services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64 # no arm64 build exists; runs via emulation on Apple Silicon
    restart: unless-stopped
    env_file: api/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml:
    build:
      context: ./ml
      args:
        TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
    environment:
      ML_SHARED_DIR: /data
      ML_MOCK: ${ML_MOCK:-false}
      ML_DEVICE: ${ML_DEVICE:-auto}
    ports:
      - "8001:8000"
    volumes:
      - shared:/data
      - ./ml/weights:/ml/weights:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    restart: unless-stopped

  api:
    build: ./api
    env_file: api/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ML_SERVICE_URL: http://ml:8000
      SHARED_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - shared:/data
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started

volumes:
  pgdata:
  shared: # blurred images: ML writes, API reads
