[project]
name = "aveiro-tech-city-ml"
version = "0.1.0"
description = "ML module for Aveiro Tech City Hackathon 2026"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.162.7",
    "python-multipart>=0.0.20",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "typer>=0.29.1",
    "ultralytics>=8.4.212",
    "uvicorn[standard]>=0.54.0",
    "python-dotenv>=1.2.4",
    "transformers>=5.23.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.5",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
